name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Мои исправления
        uses: actions/checkout@v4
        with:
          path: mine

      - name: Исходники v0.1.0 (там ещё есть демо-приложение)
        uses: actions/checkout@v4
        with:
          repository: beeping-io/beeping-android
          ref: v0.1.0
          path: src

      - name: Подменить файлы на исправленные
        run: |
          D=src/AndroidBeepingCore/src/main
          cp mine/LocalEncoder.kt mine/BeepingClient.kt mine/BeepingTimberTree.kt $D/java/com/beeping/AndroidBeepingCore/
          cp mine/AndroidManifest.xml $D/AndroidManifest.xml

      - name: Исправить запуск демо-приложения (без облачных ключей оно падало)
        run: |
          python3 - <<'PY'
          import pathlib
          base = pathlib.Path("src/app/src/main/java/com/beeping/sample")
          f = base / "SampleUiState.kt"
          t = f.read_text()
          assert "val env: SampleEnv = SampleEnv.DEV" in t
          f.write_text(t.replace("val env: SampleEnv = SampleEnv.DEV", "val env: SampleEnv = SampleEnv.LOCAL"))
          f = base / "SampleAppViewModel.kt"
          t = f.read_text()
          old = ".mode(env.toMode())"
          new = (".mode(env.toMode().let { m -> if (m is BeepingMode.Cloud && "
                 "(m.apiKey.isBlank() || !m.endpoint.startsWith(\"https://\"))) BeepingMode.Local else m })")
          assert old in t
          f.write_text(t.replace(old, new))
          print("sample app patched")
          PY

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Сборка APK
        working-directory: src
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: beeping-apk
          path: src/app/build/outputs/apk/debug/*.apk
